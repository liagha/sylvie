[package]
name = "sylvie"
version = "0.1.0"
edition = "2021"

[features]
cuda = ["candle-core/cuda"]
default = []

[dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.23.1"
rand = "0.10.1"

[profile.dev]
opt-level = 3
debug = false
lto = false